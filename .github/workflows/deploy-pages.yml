name: Deploy static site to GitHub Pages

# 每次推送到 main（含合并 PR）都会自动构建并发布；也可在 Actions 页手动触发。
# 注意：本仓库启用了「Action 必须用完整 commit SHA 固定」的安全策略，
# 因此下方所有 action 都以 40 位 SHA 固定，并用注释标明对应版本。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署到 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个发布任务，且不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact (entire repo root, contains index.html + PNGs)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
